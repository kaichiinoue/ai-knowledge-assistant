services:
  backend:
    build: ./backend
    container_name: ai_knowledge_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mysql:8.4
    container_name: ai_knowledge_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: